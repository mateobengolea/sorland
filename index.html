<body>
<div class="app" id="app"></div>
<div class="avisos" id="avisos" aria-live="polite"></div>
<script>
// Si algo falla al arrancar, mostrarlo en vez de dejar la pantalla vacía.
window.addEventListener('error', function(e){
  var app = document.getElementById('app');
  if(app && !app.children.length){
    app.innerHTML = '<div style="max-width:420px;margin:40px auto;padding:16px;background:#fff;border:2.5px solid #22304A;border-radius:16px;font-family:sans-serif">'
      + '<h2 style="margin:0 0 8px">No se pudo cargar Sorlandia</h2><p>Probá recargar la página con <b>Ctrl + F5</b>. Si sigue igual, mandá una captura de esto:</p>'
      + '<pre style="white-space:pre-wrap;font-size:12px;background:#F1F5FA;padding:8px;border-radius:8px"></pre></div>';
    app.querySelector('pre').textContent = (e.message || 'Error') + (e.filename ? '\n' + e.filename.split('/').pop() + ':' + e.lineno : '');
  }
});
</script>
